# Full stack: Postgres + Ollama + backend.
#   docker compose -f backend/docker-compose.yml up -d --build      (from the repo root)
#   docker compose -f backend/docker-compose.yml exec ollama ollama pull mistral
# For local development you can also run only the services you need, e.g. `up -d db ollama`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_coach
      POSTGRES_PASSWORD: ai_coach
      POSTGRES_DB: ai_coach
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_coach"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_coach:ai_coach@db:5432/ai_coach
      OLLAMA_API_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      ollama: { condition: service_started }

volumes:
  pgdata:
  ollama:
